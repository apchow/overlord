<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Project Overlord // Financial Defense Engine</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0A0B0E;
      color: #E7E9EE;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    .shell {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background: #12141A;
      border-bottom: 1px solid #2A2D37;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 12px;
    }
    .brand { color: #10B981; font-weight: 700; }
    .meta { color: #8B93A7; }
    .frame-wrap { flex: 1; position: relative; }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0A0B0E;
    }
    .card {
      max-width: 680px;
      margin: 64px auto;
      padding: 28px;
      background: #12141A;
      border: 1px solid #2A2D37;
      border-left: 4px solid #10B981;
      border-radius: 10px;
    }
    h1 { margin-top: 0; font-size: 22px; color: #FFFFFF; }
    p { color: #CBD5E1; line-height: 1.55; }
    code {
      background: #0D0F14;
      border: 1px solid #2A2D37;
      color: #10B981;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: "JetBrains Mono", Consolas, monospace;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="bar">
      <span class="brand">PROJECT OVERLORD // FINANCIAL DEFENSE ENGINE (PS-BA1)</span>
      <span class="meta">OBSIDIAN MISSION CONTROL PROXY</span>
    </div>
    <div id="mount" class="frame-wrap"></div>
  </div>
  <script>
    // Set your live Hugging Face Space or Docker (Render/Railway) URL here
    // when using Vercel as a static frontend proxy instead of api/index.py.
    const OVERLORD_BACKEND_URL = "";
    const mount = document.getElementById("mount");
    if (OVERLORD_BACKEND_URL) {
      const frame = document.createElement("iframe");
      const targetUrl = new URL(OVERLORD_BACKEND_URL, window.location.href);
      if (!targetUrl.searchParams.has("__theme")) {
        targetUrl.searchParams.set("__theme", "dark");
      }
      frame.src = targetUrl.toString();
      frame.allow = "clipboard-read; clipboard-write";
      mount.appendChild(frame);
    } else {
      mount.innerHTML = `
        <div class="card">
          <h1>Configure Backend URL for Static Proxy Mode</h1>
          <p>To use Vercel as an instant static Obsidian wrapper around a Hugging Face Space or Docker host (recommended if <code>api/index.py</code> exceeds Vercel's 250 MB Python bundle limit):</p>
          <p>1. Set <code>OVERLORD_BACKEND_URL</code> in <code>public/index.html</code> to your live Space/Render URL.</p>
          <p>2. Update <code>vercel.json</code> to serve <code>public/index.html</code>.</p>
        </div>
      `;
    }
  </script>
</body>
</html>
